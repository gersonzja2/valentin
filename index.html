<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz San Valentín!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="main-heart">❤️</div>
        <div class="photo-frame">
            <img src="src/images/image1.png" alt="Nosotros" class="couple-photo">
        </div>
        <h1>¡Feliz San Valentín, Liset!</h1>
        <p id="reasons">Eres mi todo...</p>
        <p>Eres mi lugar favorito en el mundo y el amor de mi vida.<br>Con todo mi amor, Gerson.</p>
        <p id="days-counter">Juntos desde hace <span id="days">0</span> días</p>
        <div id="anniversary-countdown"></div>
        <button id="loveBtn">Haz clic para una sorpresa</button>
        <div id="hiddenMessage" class="final-message">
            ¡Te amo con todo mi corazón, Liset! 💖🌹<br>Siempre tuyo, Gerson
        </div>
    </div>
    <div class="divider">💖✨💖</div>
    <div class="gallery">
        <h2>Nuestros Recuerdos</h2>
        <div class="gallery-grid">
            <img src="src/images/image2.png" alt="Recuerdo 1">
            <img src="src/images/image5.png" alt="Recuerdo 2">
            <img src="src/images/image9.png" alt="Recuerdo 3">
            <img src="src/images/image14.png" alt="Recuerdo 4">
            <img src="src/images/image18.png" alt="Recuerdo 5">
            <img src="src/images/image21.png" alt="Recuerdo 6">
            <img src="src/images/image25.png" alt="Recuerdo 7">
            <img src="src/images/image29.png" alt="Recuerdo 8">
        </div>
    </div>
    <audio id="bgMusic" loop>
        <source src="src/audio/musica.mp3" type="audio/mpeg">
    </audio>
    <button id="musicBtn" class="music-control">🎵</button>
    <script src="script.js"></script>
    <footer>
        <p>Hecho con todo mi amor para ti, Liset. ❤️</p>
    </footer>
</body>
</html>
